<style>
  :root {
    --blue: #363CFF;
    --mint: #53FFD7;
    --ink: #1F202D;
    --muted: #4A4B5C;
    --bg: #F6F6F6;
    --card: #FEFEFE;
    --border: #DEDEDE;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 56px 16px 40px;
  }
  main { width: 100%; max-width: 440px; display: flex; flex-direction: column; align-items: center; }
  .photo {
    width: 112px; height: 112px; border-radius: 50%;
    object-fit: cover; border: 3px solid var(--blue);
  }
  h1 { font-size: 26px; font-weight: 600; margin-top: 20px; letter-spacing: -0.01em; }
  .role { color: var(--muted); font-size: 16px; margin-top: 6px; }
  .bar { width: 40px; height: 4px; background: var(--mint); border-radius: 2px; margin: 24px 0 28px; }
  ul { list-style: none; padding: 0; width: 100%; display: flex; flex-direction: column; gap: 12px; }
  a.link {
    display: flex; align-items: center; gap: 14px;
    padding: 16px 18px;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    color: var(--ink); text-decoration: none; font-weight: 600; font-size: 16px;
    transition: border-color .15s, transform .15s;
  }
  a.link:hover, a.link:focus-visible { border-color: var(--blue); transform: translateY(-1px); outline: none; }
  a.link svg { width: 22px; height: 22px; flex: none; fill: var(--blue); }
  a.link .label { flex: 1; }
  a.link .sub { display: block; font-weight: 400; font-size: 13px; color: var(--muted); margin-top: 2px; }
  a.link.primary { background: var(--blue); border-color: var(--blue); color: #FEFEFE; }
  a.link.primary svg { fill: var(--mint); }
  a.link.primary .sub { color: #D6D8FF; }
  footer { margin-top: 40px; }
  footer img { height: 22px; opacity: .85; }
</style>
